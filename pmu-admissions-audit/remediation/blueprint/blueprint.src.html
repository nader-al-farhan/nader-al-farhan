<title>PMU Admissions — UX / IA Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#16263a; --ink2:#44536a; --muted:#6b778a; --paper:#f4f6f9; --sheet:#fff; --line:#dde2ea; --line2:#c7cfdb;
  --navy:#1f3a5a; --navy-soft:#e7edf5; --accent:#c9571a; --accent-soft:#fbeadf;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --pend:#9a6400; --pend-soft:#fff3d6; --gap:#b3261e; --gap-soft:#fde8e6;
  --r:12px; --focus:0 0 0 3px #ffbf47;
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.65;font-size:16px}
a{color:var(--navy)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.86em}
[dir=rtl] .mono,[dir=rtl] code{direction:ltr;unicode-bidi:isolate;display:inline-block}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:#fff;padding:8px 12px;z-index:9}
.skip:focus{top:8px}
header.top{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand b{display:block;font-size:1.02rem}
.brand span{color:var(--muted);font-size:.82rem}
.bar .sp{flex:1}
.btn{font:inherit;border:1px solid var(--line2);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.note{background:var(--pend-soft);border-bottom:1px solid #f0dca5;font-size:.86rem}
.note p{max-width:1180px;margin:auto;padding:8px 16px}
nav.toc{max-width:1180px;margin:auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav.toc a{white-space:nowrap;text-decoration:none;font-size:.88rem;padding:6px 10px;border-radius:8px;color:var(--ink2);border:1px solid transparent}
nav.toc a:hover{border-color:var(--line2)}
main{max-width:1180px;margin:auto;padding:16px}
section.s{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin:0 0 18px;scroll-margin-top:120px}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.sh .n{color:var(--accent);font-weight:700;font-family:"IBM Plex Mono",monospace}
.sh h2{margin:0;font-size:1.32rem}
.sh .en{color:var(--muted);font-size:.85rem}
.lead{color:var(--ink2);margin-top:0}
h3{font-size:1.06rem;margin:18px 0 8px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:linear-gradient(180deg,#fff,#fafbfd)}
.kpi b{font-size:1.6rem;color:var(--navy);display:block;line-height:1.2}
.kpi span{font-size:.86rem;color:var(--ink2)}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
ul.clean{margin:0;padding-inline-start:20px}
ul.clean li{margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;border-radius:999px;padding:1px 9px;border:1px solid;white-space:nowrap;line-height:1.7;margin:2px}
.c-ok{color:var(--ok);background:var(--ok-soft);border-color:#b9dfc9}
.c-pend{color:var(--pend);background:var(--pend-soft);border-color:#ecd28f}
.c-gap{color:var(--gap);background:var(--gap-soft);border-color:#f3b8b2}
.c-f{color:#6b3aa0;background:#f2eafb;border-color:#d9c6f0;font-family:"IBM Plex Mono",monospace}
.c-p{color:var(--ink2);background:#f1f3f7;border-color:var(--line2);font-family:"IBM Plex Mono",monospace}
.c-type{color:var(--navy);background:var(--navy-soft);border-color:#c8d5e6}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:start;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{background:#f3f5f9;font-weight:600;font-size:.84rem;color:var(--ink2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
/* IA tree */
.tree ul{list-style:none;margin:0;padding-inline-start:26px;border-inline-start:2px solid var(--line)}
.tree>ul{padding-inline-start:0;border:0}
.tree li{margin:10px 0;position:relative}
.tree ul ul>li::before{content:"";position:absolute;inset-inline-start:-26px;top:22px;width:22px;border-top:2px solid var(--line)}
.node{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.node.t-hub{border-color:var(--navy);box-shadow:inset 4px 0 0 var(--navy)}
[dir=rtl] .node.t-hub{box-shadow:inset -4px 0 0 var(--navy)}
.node.t-router{border-color:var(--accent)}
.node.t-archive{background:#f7f7f7;border-style:dashed}
.node h4{margin:0;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.node .path{color:var(--muted);word-break:break-all;white-space:normal;display:inline}
.node p{margin:4px 0;font-size:.9rem;color:var(--ink2)}
details.node>summary{cursor:pointer;list-style:none}
details.node>summary::-webkit-details-marker{display:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
/* device frame for live templates */
.frame-wrap{display:flex;justify-content:center;background:repeating-linear-gradient(45deg,#eef1f6,#eef1f6 10px,#e8ecf2 10px,#e8ecf2 20px);border-radius:12px;padding:18px}
.frame{container-type:inline-size;width:100%;max-width:1100px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(20,38,58,.18);overflow:hidden;border:1px solid var(--line2);transition:max-width .25s}
.frame.mobile{max-width:390px;border-radius:30px;border:10px solid #1b2430}
@media (prefers-reduced-motion:reduce){.frame{transition:none}}
.site{font-size:15px}
.site .sbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.site .logo{font-weight:700;color:var(--navy)}
.site .snav{display:flex;gap:4px;flex-wrap:wrap;font-size:.86rem}
.site .snav a{padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--ink2)}
.site .snav a[aria-current]{background:var(--navy-soft);color:var(--navy);font-weight:600}
.site .hero{background:linear-gradient(135deg,var(--navy),#2f5680);color:#fff;padding:22px 18px}
.site .hero h1{margin:0 0 4px;font-size:1.5rem}
.site .hero p{margin:0;opacity:.9}
.site .pad{padding:16px}
.site .crumb{font-size:.8rem;color:var(--muted);padding:10px 16px 0}
.site .status{display:flex;gap:10px;align-items:flex-start;border:1px solid #ecd28f;background:var(--pend-soft);border-radius:10px;padding:10px 12px;margin:14px 16px 0}
.site .status.ok{background:var(--ok-soft);border-color:#b9dfc9}
.site .routes{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
@container (max-width:560px){.site .routes{grid-template-columns:1fr 1fr}.site .hero h1{font-size:1.25rem}.site .snav{display:none}.site .cols{grid-template-columns:1fr!important}}
.site .rcard{font:inherit;text-align:start;border:1px solid var(--line2);background:#fff;border-radius:12px;padding:12px;min-height:44px;cursor:pointer}
.site .rcard:hover{border-color:var(--navy)}
.site .rcard b{display:block}
.site .rcard small{color:var(--muted)}
.site .quick{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
@container (max-width:560px){.site .quick{grid-template-columns:1fr 1fr}}
.site .qa{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:.88rem;background:#fafbfd}
.site .cols{display:grid;gap:14px;grid-template-columns:2fr 1fr}
.site .comp{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.site .comp h3{margin:0 0 6px;font-size:1rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.site .gov{font-size:.74rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.site .toc2 a{display:block;padding:6px 8px;border-radius:8px;text-decoration:none;font-size:.88rem}
.site .toc2 a:hover{background:var(--navy-soft)}
.site ul.vals{margin:4px 0;padding-inline-start:18px;font-size:.86rem}
.site .foot{background:#f3f5f9;border-top:1px solid var(--line);padding:12px 16px;font-size:.78rem;color:var(--muted)}
/* router */
.router .q{margin:10px 0}
.router .q legend{font-weight:600;margin-bottom:6px}
.router .opts{display:flex;gap:8px;flex-wrap:wrap}
.router .opts label{border:1px solid var(--line2);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.router .opts input{accent-color:var(--navy)}
.router .result{border-radius:10px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.router .result.gap{background:var(--gap-soft);border-color:#f3b8b2}
.router .result.prop{background:var(--navy-soft);border-color:#c8d5e6}
/* journey */
.jr th:first-child,.jr td:first-child{min-width:130px}
.pass{color:var(--ok);font-weight:600} .fail{color:var(--gap);font-weight:600} .pendt{color:var(--pend);font-weight:600}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem;margin:6px 0 10px}
footer.f{max-width:1180px;margin:0 auto 30px;padding:0 16px;color:var(--muted);font-size:.82rem}
@media print{header.top,nav.toc,.filters,.frame-wrap .btn{display:none}section.s{break-inside:avoid-page}}
</style>

<a class="skip" href="#main" data-i18n="skip"></a>
<header class="top">
  <div class="bar">
    <div class="brand"><b data-i18n="title"></b><span data-i18n="subtitle"></span></div>
    <div class="sp"></div>
    <button class="btn" id="langBtn" type="button"></button>
    <button class="btn" type="button" onclick="window.print()" data-i18n="print"></button>
  </div>
  <div class="note"><p data-i18n="notOfficial"></p></div>
  <nav class="toc" id="toc" aria-label="Sections"></nav>
</header>

<main id="main">
  <section class="s" id="s1"></section>
  <section class="s" id="s2"></section>
  <section class="s" id="s3"></section>
  <section class="s" id="s4"></section>
  <section class="s" id="s5"></section>
  <section class="s" id="s6"></section>
  <section class="s" id="s7"></section>
  <section class="s" id="s8"></section>
  <section class="s" id="s9"></section>
</main>
<footer class="f" id="foot"></footer>

<script>
const CANON = /*CANON*/null;
const CFG = /*CFG*/null;
const IA = /*IA*/null;
const REC = Object.fromEntries(CANON.map(r => [r.id, r]));
const NODE = Object.fromEntries(IA.sitemap.map(n => [n.id, n]));
const ROUTE = Object.fromEntries(IA.routes.map(r => [r.id, r]));
let lang = "ar";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = o => (o && typeof o === "object" && "ar" in o) ? o[lang] : o;

const UI = {
  skip:{ar:"تخطَّ إلى المحتوى",en:"Skip to content"},
  title:{ar:"مخطط تجربة المستخدم وبنية المعلومات — القبول",en:"Admissions — UX / Information Architecture Blueprint"},
  subtitle:{ar:"جامعة الأمير محمد بن فهد · مكتب القبول · حل مستقبلي قابل للتنفيذ",en:"Prince Mohammad Bin Fahd University · Admissions Office · implementable future state"},
  print:{ar:"طباعة",en:"Print"},
  notOfficial:{ar:"مخطط تصميم مقترح للنقاش الداخلي، وليس صفحة رسمية للجامعة. كل قيمة مصدرها السجل المرجعي للتدقيق (2026-09-27)؛ ما لم يُعتمد يظهر «بانتظار القرار» ولا يُعرض كحقيقة.",en:"Proposed design blueprint for internal discussion, not an official PMU page. Every value comes from the audit’s canonical record (2026-09-27); anything unapproved is shown as “pending decision”, never as fact."},
  toc:{ar:["الخلاصة","بنية المعلومات","من الحالي إلى الجديد","نماذج الصفحات","رحلة المتقدم","محرك التوجيه","الملاحة والروابط","نموذج المحتوى","معايير القبول"],
       en:["Summary","Information architecture","Current → future","Page templates","Applicant journey","Routing engine","Navigation & URLs","Content model","Acceptance criteria"]},
  approved:{ar:"معتمد",en:"Approved"}, pending:{ar:"بانتظار القرار",en:"Pending decision"}, gap:{ar:"فجوة: يحتاج قرارًا",en:"Gap: needs a decision"},
  proposed:{ar:"مقترح — يحتاج توقيع D4",en:"Proposed — needs D4 sign-off"},
  owner:{ar:"المالك",en:"Owner"}, decision:{ar:"القرار",en:"Decision"}, verified:{ar:"آخر تحقق",en:"Last verified"}, sources:{ar:"المصادر",en:"Sources"},
};
const t = k => L(UI[k]);
const OWNER_AR = {"Admissions Committee":"لجنة القبول","Admissions Committee -> Academic Council":"لجنة القبول ← المجلس الأكاديمي","English/Prep Program Director -> Admissions Committee":"مدير برنامج الإنجليزية/التحضيرية ← لجنة القبول","Graduate Studies -> Admissions Committee":"الدراسات العليا ← لجنة القبول","English/Prep Program Director":"مدير برنامج الإنجليزية/التحضيرية","Finance":"المالية","Finance + Legal":"المالية + الشؤون القانونية","Dean, College of Medicine + Finance":"عميد كلية الطب + المالية","Executive Sponsor + Admissions Director":"الراعي التنفيذي + مدير القبول","Admissions Director":"مدير القبول","Admissions Director + IT (portal)":"مدير القبول + تقنية المعلومات","Vice President for Academic Affairs":"وكيل الجامعة للشؤون الأكاديمية"};
const owner = r => lang === "ar" ? (OWNER_AR[r.owner_role] || r.owner_role) : r.owner_role;

function statusChip(id){
  const r = REC[id]; if (!r) return "";
  return r.approved_value
    ? `<span class="chip c-ok" title="${esc(r.label[lang])}">✓ ${esc(r.label[lang])}</span>`
    : `<span class="chip c-pend" title="${esc(t("pending"))} · ${esc(r.decision_ref)}">⏳ ${esc(r.label[lang])} · ${esc(r.decision_ref)}</span>`;
}
const fChip = f => `<span class="chip c-f">${esc(f)}</span>`;
const pChip = p => `<span class="chip c-p">${esc(p)}</span>`;
const TYPE = {hub:{ar:"رئيسية",en:"hub"},section:{ar:"قسم",en:"section"},route:{ar:"صفحة مسار",en:"route page"},template:{ar:"قالب",en:"template"},reference:{ar:"مرجعية",en:"reference"},router:{ar:"موجّه",en:"router"},archive:{ar:"أرشيف",en:"archive"}};
const ACTION = {merge:{ar:"دمج",en:"Merge"},move:{ar:"نقل",en:"Move"},rewrite:{ar:"إعادة كتابة",en:"Rewrite"},replace:{ar:"استبدال",en:"Replace"},rebuild:{ar:"إعادة بناء",en:"Rebuild"},template:{ar:"قالب موحّد",en:"Template"}};
const sec = (id, n, ar, en, lead) => `<div class="sh"><span class="n">${n}</span><h2>${lang==="ar"?ar:en}</h2><span class="en" lang="${lang==="ar"?"en":"ar"}">${lang==="ar"?en:ar}</span></div>${lead?`<p class="lead">${lead}</p>`:""}`;

/* ---------- routing engine (single source for router, templates and tests) ---------- */
function nextQuestion(ans){
  for (const q of IA.questions){
    if (ans[q.id] !== undefined) continue;
    if (q.when && !Object.entries(q.when).every(([k,v]) => ans[k] === v)) continue;
    return q;
  }
  return null;
}
function resolve(ans){
  const match = IA.rules.filter(r => Object.entries(r.when).every(([k,v]) => ans[k] === v));
  return match.sort((a,b) => Object.keys(b.when).length - Object.keys(a.when).length)[0] || null;
}
function runTest(tc){
  const route = ROUTE[tc.persona];
  const ans = {...route.preset};
  let clicks = 2; // route card on the home page + "Apply" on the route page
  let q, guard = 0;
  while ((q = nextQuestion(ans)) && guard++ < 5){
    if (tc.answers[q.id] === undefined) return {ok:false, clicks, rule:null, why:"unanswered:"+q.id};
    ans[q.id] = tc.answers[q.id]; clicks++;
  }
  const rule = resolve(ans);
  const got = rule ? rule.channel : undefined;
  return {ok: got === tc.expect, clicks, rule};
}

/* ---------- 1 summary ---------- */
function s1(){
  const nLegacy = IA.legacy.length, nNodes = IA.sitemap.length;
  const approved = CANON.filter(r => r.approved_value).length;
  const passLogic = IA.tests.filter(x => x.expect).map(runTest).filter(x => x.ok && x.clicks <= 3).length;
  const P = lang==="ar" ? [
    "سؤال واحد أولًا: «من أنت؟» ثم مسار واحد لكل فئة، بدل 36 رابطًا بلا ترتيب.",
    "كل رقم يُكتب مرة واحدة في السجل المرجعي، وتعرضه كل الصفحات والقنوات من المصدر نفسه.",
    "زر تقديم واحد يعمل كموجّه: يسأل سؤالين على الأكثر ثم يرسل المتقدم إلى القناة الصحيحة.",
    "لا تُعرض قيمة غير معتمدة كحقيقة؛ تظهر «بانتظار القرار» مع مصدرها، والزر يبقى معطّلًا حتى القرار.",
    "العربية والإنجليزية من القيمة نفسها، بعناوين مستقلة وسمة lang وdir صحيحة.",
    "كل صفحة تعرض «سارية لدورة · المالك · آخر تحقق»، ولا يُحذف رابط قديم قبل تحويله والتحقق منه."
  ] : [
    "One question first — “Who are you?” — then one route per category, instead of 36 unordered links.",
    "Every figure is written once in the canonical record; every page and channel shows it from that source.",
    "A single Apply button works as a router: at most two questions, then the right channel.",
    "No unapproved value is shown as fact: it appears as “pending decision” with its source, and the button stays disabled until the decision.",
    "Arabic and English from the same value, with separate URLs and correct lang and dir.",
    "Every page shows “effective for cycle · owner · last verified”; no old link is removed before it is redirected and verified."
  ];
  $("#s1").innerHTML = sec("s1","01","الخلاصة: الحل المستقبلي في صفحة واحدة","Summary: the future state on one page",
    lang==="ar" ? "هذا المخطط هو التصميم نفسه، لا توصيات عنه: بنية معلومات كاملة بعناوين URL، وخريطة لكل رابط حالي، ونماذج صفحات تعمل، ورحلة لكل فئة، ومحرك توجيه باختبارات تُنفَّذ في الصفحة. كل ما يلي مولَّد من ملف بيانات واحد (ia.json) ومن السجل المرجعي."
                : "This blueprint is the design itself, not advice about it: a full information architecture with URLs, a map for every current link, working page templates, a journey per category, and a routing engine whose tests run in the page. Everything below is generated from one data file (ia.json) and the canonical record.")
  + `<div class="grid kpis">
      <div class="kpi"><b>${nLegacy} → ${nNodes}</b><span>${lang==="ar"?"رابطًا في صفحة القبول اليوم ← صفحة في البنية الجديدة":"links on today’s admissions page → pages in the new structure"}</span></div>
      <div class="kpi"><b>6</b><span>${lang==="ar"?"مسارات للمتقدمين تبدأ من سؤال واحد":"applicant routes from one question"}</span></div>
      <div class="kpi"><b>5 → 1</b><span>${lang==="ar"?"مداخل تقديم متباينة ← موجّه واحد":"divergent apply entry points → one router"}</span></div>
      <div class="kpi"><b>${passLogic}/${IA.tests.filter(x=>x.expect).length}</b><span>${lang==="ar"?"اختبارات رحلة تصل للقناة خلال 3 نقرات أو أقل (منطق التوجيه)":"journey tests reaching a channel in ≤3 clicks (routing logic)"}</span></div>
      <div class="kpi"><b>${approved}/${CANON.length}</b><span>${lang==="ar"?"حقلًا مرجعيًا معتمدًا اليوم؛ الباقي ينتظر D1–D10":"canonical fields approved today; the rest await D1–D10"}</span></div>
    </div>
    <h3>${lang==="ar"?"مبادئ التصميم":"Design principles"}</h3><ul class="clean">${P.map(x=>`<li>${x}</li>`).join("")}</ul>

      <div class="tbl"><table class="jr"><thead><tr><th>${lang==="ar"?"المرحلة":"Stage"}</th><th>${lang==="ar"?"سؤال المتقدم":"Applicant’s question"}</th><th>${lang==="ar"?"اليوم":"Today"}</th><th>${lang==="ar"?"الصفحة الجديدة":"New page"}</th><th>${lang==="ar"?"البيانات وحالتها":"Data and status"}</th></tr></thead><tbody>
      ${IA.stages.map(st => { const p = pn[st.id]; const n = touch(st); return `<tr><td><b>${esc(L(st.t))}</b></td><td>${esc(L(st.q))}</td><td class="small">${esc(L(p.t))} ${p.f.map(fChip).join("")}</td><td>${esc(L(n.t))}<br><span class="mono muted small">${esc(n.path)}</span></td><td>${st.feeds.map(statusChip).join("")}</td></tr>`; }).join("")}
      </tbody></table></div>`;
  document.querySelectorAll("#s5 [data-p]").forEach(b => b.onclick = () => { persona = b.dataset.p; s5(); });
}

/* ---------- 6 routing engine ---------- */
function s6(){
  const results = IA.tests.map(tc => ({tc, ...runTest(tc)}));
  $("#s6").innerHTML = sec("s6","06","محرك توجيه التقديم","Application routing engine",
    lang==="ar"?"جدول قرار واحد يحدد قناة كل فئة. الأسئلة تُطرح فقط إذا لم يحددها المسار، فلا يرى المتقدم أكثر من سؤالين. القنوات مبنية على ما تنشره الجامعة اليوم (تحقق حي 2026-09-28)، وتبقى «مقترحة» حتى توقيع D4."
               :"One decision table sets the channel for each category. Questions are asked only when the route has not already answered them, so no applicant sees more than two. Channels are based on what PMU publishes today (live check 2026-09-28) and stay “proposed” until D4 is signed.")
    + `<h3>${lang==="ar"?"جدول القرار":"Decision table"}</h3><div class="tbl"><table><thead><tr><th>${lang==="ar"?"القاعدة":"Rule"}</th><th>${lang==="ar"?"الشرط":"When"}</th><th>${lang==="ar"?"القناة":"Channel"}</th><th>${lang==="ar"?"الأساس المنشور":"Published basis"}</th><th>${lang==="ar"?"الحالة":"Status"}</th></tr></thead><tbody>
      ${IA.rules.map(r=>`<tr><td class="mono">${r.id}</td><td class="mono small">${esc(Object.entries(r.when).map(([k,v])=>k+"="+v).join(" ∧ "))}</td><td>${r.channel?esc(L(IA.channels[r.channel].t)):"—"}</td><td>${r.basis.map(pChip).join("")||"—"}<div class="small muted">${esc(L(r.note))}</div></td><td>${r.status==="gap"?`<span class="chip c-gap">${t("gap")}</span>`:`<span class="chip c-pend">${t("proposed")}</span>`}</td></tr>`).join("")}
      </tbody></table></div>
      <h3>${lang==="ar"?"اختبارات الرحلة (تُنفَّذ الآن في هذه الصفحة)":"Journey tests (executed now, in this page)"}</h3>
      <div class="tbl"><table><thead><tr><th>ID</th><th>${lang==="ar"?"الفئة":"Category"}</th><th>${lang==="ar"?"المتوقع":"Expected"}</th><th>${lang==="ar"?"الناتج":"Result"}</th><th>${lang==="ar"?"النقرات":"Clicks"}</th><th>${lang==="ar"?"الحكم":"Verdict"}</th></tr></thead><tbody>
      ${results.map(({tc,ok,clicks,rule})=>{
         const got = rule ? (rule.channel ? L(IA.channels[rule.channel].t) : t("gap")) : "—";
         const exp = tc.expect ? L(IA.channels[tc.expect].t) : t("gap");
         const v = !tc.expect ? `<span class="pendt">${lang==="ar"?"فجوة مكتشفة ← D4":"Gap found → D4"}</span>` : (ok && clicks<=3 ? `<span class="pass">${lang==="ar"?"ناجح (المنطق)":"PASS (logic)"}</span>` : `<span class="fail">${lang==="ar"?"فاشل":"FAIL"}</span>`);
         return `<tr><td class="mono">${tc.id}</td><td>${esc(L(ROUTE[tc.persona].t))}${Object.keys(tc.answers).length?` <span class="small muted">(${esc(Object.values(tc.answers).join(", "))})</span>`:""}</td><td>${esc(exp)}</td><td>${esc(got)}</td><td class="mono">${clicks}</td><td>${v}</td></tr>`; }).join("")}
      </tbody></table></div>
      <p class="small muted">${lang==="ar"?"«ناجح (المنطق)» يعني أن البنية توصل الفئة إلى قناتها خلال 3 نقرات أو أقل. لا يعني أن القناة معتمدة: بوابة G4 لا تُجتاز إلا بعد توقيع D4 واختبار مستخدمين مسجّل.":"“PASS (logic)” means the structure gets the category to its channel in ≤3 clicks. It does not mean the channel is approved: gate G4 passes only after D4 is signed and recorded user tests."}</p>
      <h3>${lang==="ar"?"جرّب الموجّه":"Try the router"}</h3><div class="comp" style="border:1px solid var(--line);border-radius:10px;padding:12px" id="rtry">${routerHTML({}, "s6")}</div>`;
  const bind = () => {
    document.querySelectorAll("#rtry input[data-rk]").forEach(i => i.onchange = () => { tplAns.s6 = {...(tplAns.s6||{}), [i.dataset.q]: i.value}; $("#rtry").innerHTML = routerHTML({}, "s6"); bind(); });
    document.querySelectorAll("#rtry [data-reset]").forEach(b => b.onclick = () => { tplAns.s6 = {}; $("#rtry").innerHTML = routerHTML({}, "s6"); bind(); });
  };
  bind();
}

      <li><span class="chip c-pend">⏳ ${t("pending")}</span> ${A?"يُعرض كتنبيه مع القيم المنشورة ومصادرها؛ الحاسبات والأزرار المعتمدة عليه معطّلة.":"Shown as a notice with the published values and sources; calculators and buttons that depend on it are disabled."}</li>
      <li><span class="chip c-gap">${A?"منتهي":"Expired"}</span> ${A?"إذا تجاوز «آخر تحقق» 30 يومًا قبل فتح الدورة، يُرفع تلقائيًا إلى المالك.":"If “last verified” is older than 30 days before a cycle opens, it is escalated to the owner automatically."}</li></ul>
      <ul class="clean">

function s9(){
  const A = lang==="ar";
  const rows = [
    ["G3",A?"صفر تعارض: كل حقل له قيمة واحدة في كل الصفحات":"Zero conflicts: each field has one value across all pages","drift_check.py",A?"21 مشكلة":"21 issues"],
    ["G4",A?"6/6 فئات تصل لقناتها خلال ≤3 نقرات، مع اختبار مستخدمين مسجّل":"6/6 categories reach their channel in ≤3 clicks, with recorded user tests",A?"اختبارات القسم 06 + جلسات مستخدمين":"Section 06 tests + user sessions",A?`${IA.tests.filter(x=>x.expect).map(runTest).filter(x=>x.ok&&x.clicks<=3).length}/6 منطقيًا؛ D4 غير موقّع`:`${IA.tests.filter(x=>x.expect).map(runTest).filter(x=>x.ok&&x.clicks<=3).length}/6 by logic; D4 unsigned`],
    ["G5",A?"lang وdir صحيحة، صفر روابط http و#، نص بديل، ترتيب عناوين، WCAG 2.2 AA يدويًا":"Correct lang and dir, zero http and # links, alt text, heading order, manual WCAG 2.2 AA","dom_probe.js + "+(A?"فحص يدوي":"manual audit"),A?"lang غائبة 20/20":"lang missing 20/20"],

  + `<div class="tbl"><table><thead><tr><th>${A?"البوابة":"Gate"}</th><th>${A?"المعيار":"Criterion"}</th><th>${A?"أداة الإثبات":"Evidence tool"}</th><th>${A?"اليوم":"Today"}</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="small mono">${esc(r[2])}</td><td class="small">${r[3]}</td></tr>`).join("")}</tbody></table></div>

function render(){
  const html = document.documentElement;
  html.lang = lang; html.dir = lang==="ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  const lb = $("#langBtn"); lb.textContent = lang==="ar" ? "English" : "العربية"; lb.lang = lang==="ar" ? "en" : "ar";
  $("#toc").innerHTML = UI.toc[lang].map((x,i)=>`<a href="#s${i+1}">${String(i+1).padStart(2,"0")} ${x}</a>`).join("");
  s1(); s2(); s3(); s4(); s5(); s6(); s7(); s8(); s9();
  $("#foot").textContent = lang==="ar" ? "مخطط مستقل مبني على تدقيق 2026-09-27 وتحقق حي 2026-09-28. ليس صفحة رسمية، ولا يمثل قرارًا من الجامعة، ولا يجمع أي بيانات شخصية." : "Independent blueprint based on the 2026-09-27 audit and a live check on 2026-09-28. Not an official page; does not represent a PMU decision; collects no personal data.";
}
$("#langBtn").onclick = () => { lang = lang==="ar" ? "en" : "ar"; render(); };
render();
</script>
