<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admissions Hub · Applicant Journey — Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#16263a; --ink-2:#3f4e63; --muted:#5f6d80;
  --paper:#f4f6f9; --sheet:#fff; --line:#dce2ea; --line-2:#c5cedb;
  --navy:#1f3a5a; --navy-soft:#e7edf5;
  --accent:#c2551a; --accent-soft:#fbeadf;
  --ok:#1f7a4d; --ok-soft:#e3f3ea;
  --warn:#8a5a00; --warn-soft:#fff3d6;
  --crit:#a3262a; --crit-soft:#fbe4e4;
  --focus:#1d6fd6;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7edf5; --ink-2:#c3cedb; --muted:#9aa8ba;
    --paper:#0f1824; --sheet:#162232; --line:#27374b; --line-2:#34485f;
    --navy:#9cc0ea; --navy-soft:#1c2c41;
    --accent:#f0915a; --accent-soft:#3a2518;
    --ok:#6fcf9b; --ok-soft:#153324; --warn:#f2c46b; --warn-soft:#3a2e12; --crit:#f08a8d; --crit-soft:#3b1b1d;
    --focus:#7fb3ff;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.skip{position:absolute;inset-inline-start:-999px;top:8px;background:var(--sheet);padding:8px 12px;z-index:9}
.skip:focus{inset-inline-start:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;margin-inline-end:auto}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.btn{min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);color:var(--sheet);border-color:var(--navy)}
.btn[aria-pressed="true"]{background:var(--navy-soft);border-color:var(--navy)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.concept{background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.concept .wrap{padding-block:8px;font-size:.88rem}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 8px}
nav.tabs button{background:transparent;border:1px solid transparent}
nav.tabs button[aria-selected="true"]{background:var(--sheet);border-color:var(--line-2);box-shadow:0 1px 0 var(--line)}
section.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin:12px 0 22px}
h1{font-size:1.6rem;line-height:1.35;margin:18px 0 4px}
h2{font-size:1.25rem;margin:0 0 10px}
h3{font-size:1.02rem;margin:18px 0 8px}
p{margin:6px 0}
.lead{color:var(--ink-2)}
.status{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-inline-start:5px solid var(--warn);background:var(--sheet);border-radius:var(--r);padding:14px 16px;margin:14px 0}
.status b{display:block}
.grid{display:grid;gap:12px}
.routes{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.route{text-align:start;display:flex;flex-direction:column;gap:4px;padding:14px;min-height:96px}
.route .ic{font-size:1.4rem}
.route small{color:var(--muted);font-weight:500}
.route[aria-pressed="true"]{outline:2px solid var(--navy)}
ol.steps{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;counter-reset:s}
ol.steps li button{width:100%;text-align:start;display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:.88rem}
ol.steps li button .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy-soft);color:var(--navy);font-weight:700;flex:none}
ol.steps li button[aria-current="step"]{background:var(--navy);color:var(--sheet);border-color:var(--navy)}
ol.steps li button[aria-current="step"] .n{background:var(--sheet)}
.two{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:900px){.two{grid-template-columns:1.1fr .9fr}}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--sheet)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
label{display:block;font-weight:600;margin:10px 0 4px}
input[type=number],select,input[type=search]{width:100%;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);font:inherit}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:currentColor}
.chip.pend{color:var(--warn);background:var(--warn-soft);border-color:currentColor}
.chip.crit{color:var(--crit);background:var(--crit-soft);border-color:currentColor}
.gov{display:none;margin-top:6px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line-2);padding-top:6px}
body.govon .gov{display:block}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:start;vertical-align:top}
th{background:var(--navy-soft);font-weight:600}
.tbl{overflow-x:auto}
.res{font-size:1.05rem}
.big{font-size:1.6rem;font-weight:700}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
ul.check input{width:22px;height:22px;margin-top:4px;flex:none}
.answer{margin-top:10px}
.diagram svg{width:100%;height:auto;display:block}
.diagram text{font-family:inherit}
.note{border-inline-start:4px solid var(--navy);background:var(--navy-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
[dir=ltr] .note{border-radius:8px 0 0 8px}
footer{color:var(--muted);font-size:.82rem;padding:20px 0 40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
</style>

<a class="skip" href="#main" data-i18n="skip"></a>
<header class="top"><div class="wrap">
  <div class="brand"><span data-i18n="brand"></span><small data-i18n="brandSub"></small></div>
  <button class="btn" id="govBtn" aria-pressed="false" data-i18n="govBtn"></button>
  <button class="btn" id="langBtn" lang="en">English</button>
</div></header>
<div class="concept" role="note"><div class="wrap" data-i18n="concept"></div></div>

<main id="main" class="wrap">
  <h1 data-i18n="h1"></h1>
  <p class="lead" data-i18n="lead"></p>
  <div class="status" role="status" id="statusBanner"></div>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="btn" role="tab" id="t-hub" aria-controls="p-hub" aria-selected="true" data-i18n="tabHub"></button>
    <button class="btn" role="tab" id="t-journey" aria-controls="p-journey" aria-selected="false" data-i18n="tabJourney"></button>
    <button class="btn" role="tab" id="t-sim" aria-controls="p-sim" aria-selected="false" data-i18n="tabSim"></button>
    <button class="btn" role="tab" id="t-arch" aria-controls="p-arch" aria-selected="false" data-i18n="tabArch"></button>
    <button class="btn" role="tab" id="t-std" aria-controls="p-std" aria-selected="false" data-i18n="tabStd"></button>
  </nav>

  <!-- HUB -->
  <section class="panel" role="tabpanel" id="p-hub" aria-labelledby="t-hub">
    <h2 data-i18n="whoTitle"></h2>
    <p class="muted" data-i18n="whoLead"></p>
    <div class="grid routes" id="routes"></div>
    <h3 data-i18n="askTitle"></h3>
    <label for="ask" data-i18n="askLabel"></label>
    <input type="search" id="ask" autocomplete="off">
    <div class="answer" id="answer" aria-live="polite"></div>
  </section>

  <!-- JOURNEY -->
  <section class="panel" role="tabpanel" id="p-journey" aria-labelledby="t-journey" hidden>
    <h2 id="jTitle"></h2>
    <p class="muted" id="jRoute"></p>
    <ol class="steps" id="steps"></ol>
    <div id="stepBody" aria-live="polite"></div>
  </section>

  <!-- DECISION SIMULATOR -->
  <section class="panel" role="tabpanel" id="p-sim" aria-labelledby="t-sim" hidden>
    <h2 data-i18n="simTitle"></h2>
    <p class="muted" data-i18n="simLead"></p>
    <div class="row">
      <div><label for="sHs" data-i18n="hs"></label><input type="number" id="sHs" min="0" max="100" step="0.1" value="78"></div>
      <div><label for="sGat" data-i18n="gat"></label><input type="number" id="sGat" min="0" max="100" value="72"></div>
      <div><label for="sTah" data-i18n="tah"></label><input type="number" id="sTah" min="0" max="100" value="70"></div>
      <div><label for="sInt" data-i18n="interview"></label><input type="number" id="sInt" min="0" max="100" value="75"></div>
    </div>
    <div class="tbl" style="margin-top:14px"><table id="simTable"></table></div>
    <div class="note" id="simVerdict" aria-live="polite"></div>
  </section>

  <!-- ARCHITECTURE -->
  <section class="panel" role="tabpanel" id="p-arch" aria-labelledby="t-arch" hidden>
    <h2 data-i18n="archTitle"></h2>
    <p class="muted" data-i18n="archLead"></p>
    <div class="diagram" id="diagram"></div>
    <div class="tbl"><table id="archTable"></table></div>
  </section>

  <!-- STANDARDS -->
  <section class="panel" role="tabpanel" id="p-std" aria-labelledby="t-std" hidden>
    <h2 data-i18n="stdTitle"></h2>
    <p class="muted" data-i18n="stdLead"></p>
    <div class="tbl"><table id="stdTable"></table></div>
  </section>

  <footer data-i18n="footer"></footer>
</main>

let lang = "ar", route = null, step = 0;
const $ = s => document.querySelector(s);
const t = k => T[lang][k];
const fmt = n => new Intl.NumberFormat(lang === "ar" ? "ar-SA-u-nu-latn" : "en-US").format(Math.round(n));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function statusChip(r){
  if (r.approved_value) return `<span class="chip ok">✓ ${t("approved")}</span>`;
  const cls = r.status === "consistent" ? "ok" : (r.status === "gap" ? "crit" : "pend");
  const txt = r.status === "consistent" ? t("consistent") : (r.status === "gap" ? t("gap") : t("pending") + " · " + esc(r.decision_ref || ""));
  return `<span class="chip ${cls}">${txt}</span>`;
}
function gov(r, extraSources){
  const src = extraSources || r.published_values.flatMap(v => v.sources);
  return `<div class="gov">${t("owner")}: ${esc(ownerTxt(r))} · ${t("decision")}: ${esc(r.decision_ref)} · ${t("sources")}: <span class="mono">${esc([...new Set(src)].join(", "))}</span> · ${t("askVerified")}: <span class="mono">${esc(r.last_verified)}</span></div>`;
}
function valuesList(r){
  return `<ul class="small">` + r.published_values.map(v => `<li><span lang="en" dir="ltr">${esc(v.value)}</span> <span class="mono muted">(${esc(v.sources.join(", "))})</span></li>`).join("") + `</ul>`;
}

function applyLang(){
  const html = document.documentElement;
  html.lang = lang; html.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  const lb = $("#langBtn"); lb.textContent = lang === "ar" ? "English" : "العربية"; lb.lang = lang === "ar" ? "en" : "ar";
  $("#statusBanner").innerHTML = `<div><b>${t("status")} ${statusChip(REC.intake_status)}</b>${t("statusMsg")}${gov(REC.intake_status)}</div>`;
  renderRoutes(); renderJourney(); renderSim(); renderArch(); renderStd(); answer();
}

function renderRoutes(){
  $("#routes").innerHTML = Object.entries(t("routes")).map(([k,[ic,name,sub]]) =>
    `<button class="btn route" data-route="${k}" aria-pressed="${route===k}"><span class="ic" aria-hidden="true">${ic}</span>${name}<small>${sub}</small></button>`).join("");
  document.querySelectorAll(".route").forEach(b => b.onclick = () => { route = b.dataset.route; step = 0; renderRoutes(); openTab("journey"); renderJourney(); });
}

function renderJourney(){
  $("#jTitle").textContent = t("jTitle");
  $("#jRoute").textContent = route ? t("jFor") + t("routes")[route][1] : t("jPick");
  $("#steps").innerHTML = t("steps").map((s,i) => `<li><button class="btn" data-step="${i}" ${i===step?'aria-current="step"':''}><span class="n">${i+1}</span>${s}</button></li>`).join("");
  document.querySelectorAll("#steps button").forEach(b => b.onclick = () => { step = +b.dataset.step; renderJourney(); });
  $("#stepBody").innerHTML = route ? stepBody() : "";
  wireStep();
}

function stepBody(){
  const h = `<h3>${step+1}. ${t("steps")[step]}</h3>`;
  if (step === 0) return h + `<div class="card"><p>${statusChip(REC.programme_register)}</p><p>${t("s1")}</p>${gov(REC.programme_register)}</div>`;
  if (step === 1){
    const f = CFG.formulas.filter(x => x.routes.includes(route === "medicine" ? "medicine" : "saudi_hs"));
    const needTah = f.some(x => x.weights.tah);
    let calc = "";
    if (["saudi_hs","medicine","international"].includes(route)){
      calc = `<div class="card"><p class="muted small">${t("s2lead")}</p><div class="row">
        <div><label for="jHs">${t("hs")}</label><input type="number" id="jHs" min="0" max="100" step="0.1" value="84"></div>
        <div><label for="jGat">${t("gat")}</label><input type="number" id="jGat" min="0" max="100" value="72"></div>
        ${needTah?`<div><label for="jTah">${t("tah")}</label><input type="number" id="jTah" min="0" max="100" value="70"></div>`:""}
        </div><div id="jMin" aria-live="polite" style="margin-top:10px"></div>
        <div class="note"><p>${statusChip(REC.composite_formula)} ${t("s2wait")}</p><p><button class="btn" id="goSim">${t("s2seeSim")}</button></p></div>${gov(REC.composite_formula)}</div>`;
    }
    const eng = `<div class="card" style="margin-top:12px"><b>${t("eng")}</b> ${statusChip(REC.english_ug_direct)}${valuesList(REC.english_ug_direct)}<p class="small muted">${esc(REC.english_ug_direct.note||"")}</p>${gov(REC.english_ug_direct)}</div>`;
    const grad = route === "graduate" ? `<div class="card" style="margin-top:12px"><b>${esc(REC.english_grad.label[lang])}</b> ${statusChip(REC.english_grad)}${valuesList(REC.english_grad)}${gov(REC.english_grad)}</div>` : "";
    return h + calc + (route === "graduate" ? grad : eng);
  }
  if (step === 2){
    const vat = CFG.vat.rate;
    const fee = route === "medicine"
      ? `<p><b>${t("appFee")}</b> ${statusChip(REC.application_fee)} <span class="mono">SAR ${CFG.application_fee.options.filter(o=>o.route==="medicine").map(o=>fmt(o.value)+" ("+o.sources.join(",")+")").join(" / ")}</span></p>`
      : `<p><b>${t("appFee")}</b> ${statusChip(REC.application_fee)}</p>${valuesList(REC.application_fee)}`;
    if (route === "medicine"){
      const m = CFG.medicine_fees;
      return h + `<div class="two"><div class="card"><b>${t("medFees")}</b> ${statusChip(REC.tuition_medicine)}
        <table><tr><th>${t("medPrep")}</th><td class="mono">SAR ${fmt(m.prep_per_year)}</td></tr><tr><th>${t("medProg")}</th><td class="mono">SAR ${fmt(m.program_per_year)}</td></tr><tr><th>${t("seat")}</th><td class="mono">SAR ${fmt(m.seat_reservation)}</td></tr></table>
        ${valuesList(REC.tuition_medicine)}${gov(REC.tuition_medicine)}</div>
        <div class="card">${fee}${gov(REC.application_fee)}<p><b>${t("refund")}</b> ${statusChip(REC.refund_policy)}</p>${valuesList(REC.refund_policy)}${gov(REC.refund_policy)}</div></div>`;
    }
    if (route === "graduate" || route === "visiting") return h + `<div class="card">${fee}${gov(REC.application_fee)}<p><b>${t("refund")}</b> ${statusChip(REC.refund_policy)}</p>${valuesList(REC.refund_policy)}</div>`;
    const g = CFG.tuition_2026_27.groups;
    return h + `<div class="two"><div class="card"><p class="muted small">${t("s3lead")}</p>
      <label for="cGroup">${t("group")}</label><select id="cGroup">${Object.entries(g).map(([k,v])=>`<option value="${k}">${v[lang]}</option>`).join("")}</select>
      <label for="cNat">${t("nat")}</label><select id="cNat"><option value="sa">${t("saudi")}</option><option value="int" ${route==="international"?"selected":""}>${t("nonsaudi")}</option></select>
      <div id="cOut" aria-live="polite" style="margin-top:12px"></div><p class="small muted">${t("vatNote")}</p>${gov(REC.tuition_ug, CFG.tuition_2026_27.sources)}${gov(REC.vat_statement)}</div>
      <div class="card">${fee}${gov(REC.application_fee)}<p><b>${t("refund")}</b> ${statusChip(REC.refund_policy)}</p>${valuesList(REC.refund_policy)}${gov(REC.refund_policy)}</div></div>`;
  }
  if (step === 3){
    const c = CFG.channels.calendar_rule;
    const intl = route === "international";
    const cal = route === "saudi_hs" || route === "medicine" ? t("chSaudi") : (intl ? t("chIntl") : t("chPortal"));
    return h + `<div class="card"><p class="muted small">${t("s4lead")}</p>
      <table><tr><th>${t("calRule")}</th><td>${cal}</td></tr><tr><th>${t("portalRule")}</th><td>${t("chPortal")} <span class="mono muted">(${CFG.channels.portal.sources.join(", ")})</span></td></tr></table>
      <div class="note">${statusChip(REC.application_channel)} ${t("s4wait")}</div>${gov(REC.application_channel)}
      <p style="margin-top:12px"><b>${t("status")}</b> ${statusChip(REC.intake_status)}</p><p>${t("statusMsg")}</p></div>`;
  }
  if (step === 4){
    const docs = CFG.documents.filter(d => d.routes.includes(route));
    return h + `<div class="card"><p class="muted small">${t("s5lead")} ${statusChip(REC.required_documents)}</p><ul class="check">` +
      docs.map(d => `<li><input type="checkbox" id="d-${d.id}"><label for="d-${d.id}" style="margin:0;font-weight:500">${d[lang]}${d.variants.filter(v=>v[lang]).map(v=>`<br><span class="small muted">${t("variant")}: ${v[lang]} <span class="mono">(${v.sources.join(", ")})</span></span>`).join("")}</label></li>`).join("") +
      `</ul>${gov(REC.required_documents)}</div>`;
  }
  if (step === 5) return h + `<div class="card"><p>${t("s6lead")}</p><p><button class="btn primary" disabled aria-describedby="applyWhy">${t("applyBtn")}</button></p><p id="applyWhy" class="small">${statusChip(REC.application_channel)} ${t("s4wait")}</p>${gov(REC.application_channel)}</div>`;
  return h + `<div class="card"><p>${t("s7lead")}</p><ol>${t("s7items").map(x=>`<li>${x}</li>`).join("")}</ol><p class="small">${statusChip(REC.contacts)} ${esc(REC.contacts.label[lang])}</p>${valuesList(REC.contacts)}${gov(REC.contacts)}</div>`;
}

function wireStep(){
  const gs = $("#goSim"); if (gs) gs.onclick = () => openTab("sim");
  ["jHs","jGat","jTah"].forEach(id => { const e = document.getElementById(id); if (e) e.oninput = minCheck; });
  if ($("#jHs")) minCheck();
  ["cGroup","cNat"].forEach(id => { const e = document.getElementById(id); if (e) e.onchange = cost; });
  if ($("#cGroup")) cost();
}
function num(id){ const e = document.getElementById(id); return e ? parseFloat(e.value) : NaN; }
function minCheck(){
  const key = route === "medicine" ? "medicine" : "saudi_hs";
  const m = CFG.minimums[key];
  const vals = {hs: num("jHs"), gat: num("jGat"), tah: num("jTah")};
  const rows = Object.entries(m).filter(([k]) => !isNaN(vals[k])).map(([k,v]) => {
    const ok = vals[k] >= v.value;
    return `<li>${t(k)}: <span class="mono">${vals[k]} ≥ ${v.value}</span> — <span class="chip ${ok?"ok":"crit"}">${ok?t("pass"):t("fail")}</span> ${statusChip(REC[v.canon])}</li>`;
  });
  $("#jMin").innerHTML = `<b>${t("minCheck")}</b><ul class="small">${rows.join("")}</ul>`;
}
function cost(){
  const g = $("#cGroup").value, sa = $("#cNat").value === "sa";
  const base = CFG.tuition_2026_27.per_semester[g];
  const sem = sa ? base : base * (1 + CFG.vat.rate);
  $("#cOut").innerHTML = `<div>${t("perSem")} ${statusChip(REC.tuition_ug)}</div><div class="big mono">SAR ${fmt(sem)}</div><div class="muted">${t("perYear")}: <span class="mono">SAR ${fmt(sem*2)}</span></div>`;
}

function renderSim(){
  const v = {hs: num("sHs"), gat: num("sGat"), tah: num("sTah"), interview: num("sInt")};
  const rows = CFG.formulas.map(f => {
    const mkey = f.routes.includes("medicine") ? "medicine" : "saudi_hs";
    const mins = CFG.minimums[mkey];
    let s = null, out, minTxt, fails = [];
    if (f.rule === "legacy_p20"){
      out = (v.gat >= 60 && v.hs >= 80) ? "ok" : (v.gat >= 60 && v.hs >= 70 ? "cond" : "no");
      minTxt = `${t("hs")} 80 (${t("orWith")} 70 + ${t("interview")}) · ${t("gat")} 60`;
    } else {
      s = Object.entries(f.weights).reduce((a,[k,w]) => a + w * (v[k]||0), 0);
      fails = Object.entries(mins).filter(([k,m]) => f.weights[k] !== undefined && v[k] < m.value).map(([k]) => t(k));
      out = (fails.length === 0 && (!f.minimum || s >= f.minimum)) ? "ok" : "no";
      minTxt = [f.minimum ? `${t("composite")} ${f.minimum}` : "", Object.entries(mins).filter(([k])=>f.weights[k]!==undefined).map(([k,m])=>`${t(k)} ${m.value}`).join(" · ")].filter(Boolean).join(" · ") || t("noMin");
    }
    const chip = out === "ok" ? `<span class="chip ok">${t("admitLike")}</span>` : out === "cond" ? `<span class="chip pend">${t("condLike")}</span>` : `<span class="chip crit">${t("notLike")}</span>`;
    return {f, s, out, row: `<tr><td><b>${f.id}</b> · ${f.label[lang]}<br><span class="mono small muted">${f.sources.join(", ")}</span></td><td class="mono">${s === null ? "—" : s.toFixed(1)}</td><td class="small">${minTxt}</td><td>${chip}${fails.length?`<br><span class="small muted">${fails.join(lang==="ar"?"، ":", ")}</span>`:""}</td></tr>`};
  });
  $("#simTable").innerHTML = `<tr><th>${t("formula")}</th><th>${t("score")}</th><th>${t("mins")}</th><th>${t("result")}</th></tr>` + rows.map(r=>r.row).join("");
  const general = rows.filter(r => r.f.routes.includes("saudi_hs"));
  const outs = new Set(general.map(r => r.out));
  const scores = general.filter(r => r.s !== null).map(r => r.s);
  const spread = t("spread").replace("{a}", `<bdi dir="ltr">${Math.min(...scores).toFixed(1)}</bdi>`).replace("{b}", `<bdi dir="ltr">${Math.max(...scores).toFixed(1)}</bdi>`);
  $("#simVerdict").innerHTML = `<p>${statusChip(REC.composite_formula)} <b>${outs.size > 1 ? t("simDiff") : t("simSame")}</b></p><p>${spread}</p>${gov(REC.composite_formula)}`;
}
["sHs","sGat","sTah","sInt"].forEach(id => document.getElementById(id).oninput = renderSim);

function renderArch(){
  const L = t("arch");
  const C = {line:"currentColor", acc:"#c2551a"};
  const W = 1000, bw = 620, bh = 64, x = (W-bw)/2;
  const box = (x,y,w,h,title,sub,col) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${col}" fill-opacity=".13" stroke="${col}"/><text x="${x+w/2}" y="${y+27}" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">${esc(title)}</text><text x="${x+w/2}" y="${y+49}" text-anchor="middle" font-size="12.5" fill="currentColor" fill-opacity=".8">${esc(sub)}</text>`;
  const arrow = (x1,y1,x2,y2) => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="currentColor" stroke-width="2" marker-end="url(#ah)"/>`;
  let y = 10, svg = "";
  svg += box(x,y,bw,bh,L[0][0],L[0][2],"#1f3a5a"); svg += arrow(W/2,y+bh,W/2,y+bh+26); y += bh+30;
  svg += box(x,y,bw,bh,L[1][0],L[1][2],"#1f7a4d"); svg += arrow(W/2,y+bh,W/2,y+bh+26); y += bh+30;
  svg += box(x,y,bw,bh,L[2][0],L[2][2],"#3f4e63"); const yApi = y+bh; y += bh+44;
  const sw = 300, sg = 20, sx = (W - (3*sw + 2*sg))/2;
  [[3,"#c2551a"],[4,"#6b4fa0"],[5,"#1f3a5a"]].forEach(([k,col],i) => { const bx = sx + i*(sw+sg); svg += arrow(W/2, yApi, bx+sw/2, y-4); svg += box(bx,y,sw,bh+10,L[k][0],L[k][2],col); });
  const ySurf = y+bh+10; y += bh+50;
  [0,1,2].forEach(i => { const bx = sx + i*(sw+sg); svg += arrow(bx+sw/2, ySurf, W/2, y-4); });
  svg += box(x,y,bw,bh,L[6][0],L[6][2],"#8a5a00");
  const yTop = 10+bh/2, yMon = y+bh/2;
  svg += `<path d="M${x+bw} ${yMon} H${W-20} V${yTop} H${x+bw+6}" fill="none" stroke="${C.acc}" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah2)"/>`;
  const H = y+bh+14;
  $("#diagram").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("archTitle"))}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="${C.acc}"/></marker></defs>${svg}</svg>`;
  $("#archTable").innerHTML = `<tr>${t("archCols").map(c=>`<th>${c}</th>`).join("")}</tr>` + L.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("");
}
function renderStd(){
  $("#stdTable").innerHTML = `<tr>${t("stdCols").map(c=>`<th>${c}</th>`).join("")}</tr>` + STD.map(s =>
    `<tr><td><a href="${s.url}" rel="noopener" target="_blank">${esc(s.ref[lang])}</a></td><td>${esc(s.req[lang])}</td><td>${esc(s.how[lang])}</td><td class="small">${esc(s.kind[lang])}</td></tr>`).join("");
}

// Arabic-aware matching: drop diacritics and tatweel, unify alef/ya/ta-marbuta forms
function norm(x){
  return x.toLowerCase().replace(/[\u064B-\u0652\u0670\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim();
}
// Owner roles are stored in English in the canonical record; show them in Arabic in the Arabic UI
const OWNER_AR = {
  "Admissions Committee":"لجنة القبول",
  "Admissions Committee -> Academic Council":"لجنة القبول ← المجلس الأكاديمي",
  "English/Prep Program Director -> Admissions Committee":"مدير برنامج اللغة الإنجليزية / السنة التحضيرية ← لجنة القبول",
  "Graduate Studies -> Admissions Committee":"الدراسات العليا ← لجنة القبول",
  "English/Prep Program Director":"مدير برنامج اللغة الإنجليزية / السنة التحضيرية",
  "Finance":"المالية",
  "Finance + Legal":"المالية + الشؤون القانونية",
  "Dean, College of Medicine + Finance":"عميد كلية الطب + المالية",
  "Executive Sponsor + Admissions Director":"الراعي التنفيذي + مدير القبول",
  "Admissions Director":"مدير القبول",
  "Admissions Director + IT (portal)":"مدير القبول + تقنية المعلومات (البوابة)",
  "Vice President for Academic Affairs":"وكيل الجامعة للشؤون الأكاديمية"
};
const ownerTxt = r => (lang === "ar" && OWNER_AR[r.owner_role]) ? OWNER_AR[r.owner_role] : r.owner_role;

function answer(){
  const q = norm($("#ask").value || "");
  const out = $("#answer");
  if (!q){ out.innerHTML = `<p class="small muted">${t("assistNote")}</p>`; return; }
  let best = null, bestScore = 0;
  for (const [id, kws] of Object.entries(CFG.faq_keywords)){
    const r = REC[id]; if (!r) continue;
    let s = kws.reduce((a,k) => a + (q.includes(norm(k)) ? norm(k).length : 0), 0);
    if (q.includes(norm(r.label.ar)) || q.includes(norm(r.label.en))) s += 20;
    if (s > bestScore){ bestScore = s; best = r; }
  }
  if (!best){ out.innerHTML = `<p>${t("askNone")}</p>`; return; }
  const body = best.approved_value
    ? `<p><b>${t("askApproved")}:</b> <span dir="ltr" lang="en">${esc(best.published_values[0].value)}</span> <span class="mono muted">(${esc(best.published_values[0].sources.join(", "))})</span></p><p class="small muted" dir="ltr" lang="en">${esc(best.approved_value)}</p>`
    : `<p>${t("askPending")}</p>${valuesList(best)}`;
  out.innerHTML = `<div class="card"><b>${esc(best.label[lang])}</b> ${statusChip(best)}${body}<p class="small muted">${t("askOwner")}: ${esc(ownerTxt(best))} · ${t("askDecision")}: ${esc(best.decision_ref)} · ${t("askVerified")}: <span class="mono">${esc(best.last_verified)}</span></p><p class="small muted">${t("assistNote")}</p></div>`;
}
$("#ask").oninput = answer;

function openTab(id){
  document.querySelectorAll('[role="tab"]').forEach(b => b.setAttribute("aria-selected", b.id === "t-"+id));
  document.querySelectorAll('[role="tabpanel"]').forEach(p => p.hidden = p.id !== "p-"+id);
  const panel = document.getElementById("p-"+id); if (panel) panel.querySelector("h2").focus?.();
}
document.querySelectorAll('[role="tab"]').forEach(b => {
  b.onclick = () => openTab(b.id.slice(2));
  b.onkeydown = e => {
    const tabs = [...document.querySelectorAll('[role="tab"]')]; const i = tabs.indexOf(b);
    const fwd = (lang === "ar") ? "ArrowLeft" : "ArrowRight", back = (lang === "ar") ? "ArrowRight" : "ArrowLeft";
    if (e.key === fwd) { tabs[(i+1)%tabs.length].focus(); tabs[(i+1)%tabs.length].click(); }
    if (e.key === back) { tabs[(i-1+tabs.length)%tabs.length].focus(); tabs[(i-1+tabs.length)%tabs.length].click(); }
  };
});
document.querySelectorAll("section.panel h2").forEach(h => h.tabIndex = -1);
$("#langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; applyLang(); };
$("#govBtn").onclick = () => { const on = document.body.classList.toggle("govon"); $("#govBtn").setAttribute("aria-pressed", on); };
applyLang();
</script>
